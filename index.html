<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="./public/css/style.css">
    <title>Weather</title>
</head>
<body >
    
<div id="weather">
    <input type="text" class="search">
    <div class="content">
        <h1 class="capital">
            <span class="city">HN</span>
            <span>,</span>
            <span class="country">VN</span>
        </h1>
        <div class="time"></div>

        <div class="temp">
            <span class="value">23 <sup>o</sup>C</span>
        </div>

        <div class="short-decs">Clouds</div>
        <div class="more-decs">
            <div class="visibility">
            <i class="far fa-eye"></i>
                <span>1000m</span>
            </div>
            <div class="wind">
                <i class="fas fa-wind"></i>
                    <span>1000m</span>
                </div>
                <div class="sun">
                    <i class="far fa-sun"></i>
                        <span>1000m</span>
                    </div>
        </div>
    </div>
</div>


    <script src="public/js/app.js"></script>
</body>
</html>
